name: train-pool
on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: flow_n12_pfrl,  scene: flow,  n: 12, mode: pfrl, dxy: 0.5, preset: "" }
          - { tag: burst_n12_pfrl, scene: burst, n: 12, mode: pfrl, dxy: 0.5, preset: "" }
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include

      - name: Fetch n60 channel table
        if: matrix.n == 60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download chan-tables --repo ${{ github.repository }} \
            --pattern "chan_60_uma_2ghz.npz" \
            --output env_data/channel/chan_60_uma_2ghz.npz
          ls -la env_data/channel/

      - name: Import smoke test
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          python -c "import uav_env, pfrl, ddpga, dqnm; print('IMPORT_OK')"

      - name: Speed gate (30 rollouts, must fit 6h budget)
        shell: bash
        run: |
          set -e
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          PA=""
          if [ -n "${{ matrix.preset }}" ]; then PA="--preset ${{ matrix.preset }}"; fi
          S=$(date +%s)
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
          PF_CHANNEL=umi PF_SHADOW_DB=random PF_DXY_MAX=${{ matrix.dxy }} \
            python ${{ matrix.mode }}.py --mode ${{ matrix.mode }} --tau 5 \
            --seed 0 --scene ${{ matrix.scene }} --n-uav ${{ matrix.n }} \
            --total-rollouts 30 --fresh $PA \
            --task speed_${{ matrix.tag }} 2>&1 | tail -3
          E=$(date +%s)
          T=$((E-S))
          python -c "import sys; t=$T; per=t/30.0; est=per*1200; budget=355*60-420; fit='YES' if est<budget else 'NO'; print(f'[SPEED] total_30={t}s per_rollout={per:.1f}s est_1200={est:.0f}s ({est/3600:.2f}h) budget={budget}s fit={fit}'); sys.exit(0 if fit=='YES' else 3)"

      - name: Train
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          PA=""
          if [ -n "${{ matrix.preset }}" ]; then PA="--preset ${{ matrix.preset }} --task ${{ matrix.tag }}"; fi
          rm -rf ckpt/speed_${{ matrix.tag }}
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
          PF_CHANNEL=umi PF_SHADOW_DB=random PF_DXY_MAX=${{ matrix.dxy }} \
            python ${{ matrix.mode }}.py --mode ${{ matrix.mode }} --tau 5 \
            --seed 0 --scene ${{ matrix.scene }} --n-uav ${{ matrix.n }} \
            --total-rollouts 1200 --fresh $PA 2>&1 | tee train_${{ matrix.tag }}.log

      - name: Upload ckpt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt_${{ matrix.tag }}
          path: |
            code/ckpt/
            code/train_*.log
          if-no-files-found: warn
