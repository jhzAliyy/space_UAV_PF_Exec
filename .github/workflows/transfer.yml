name: ckpt-transfer
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download burst_n12
        uses: actions/download-artifact@v4
        with:
          run-id: "41443377755"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          name: ckpt_burst_n12_pfrl

      - name: Download burst_n30 + rizvi3
        uses: actions/download-artifact@v4
        with:
          run-id: "41444826741"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          name: ckpt_burst_n30_pfrl

      - name: Download rizvi3
        uses: actions/download-artifact@v4
        with:
          run-id: "41449743844"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          name: ckpt_native_pfrl_rizvi3

      - name: Strip snaps, keep triads
        run: |
          find dl -type d -name snaps -exec rm -rf {} + || true
          find dl -type f | sort

      - name: Push to ckpt-v2-r2 branch
        run: |
          cd dl
          git init -q
          git config user.name "ckpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b ckpt-v2-r2
          git add -A
          git commit -qm "v2 ckpt triads r2: burst_n12 + burst_n30 + rizvi3"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ckpt-v2-r2
          echo PUSHED
