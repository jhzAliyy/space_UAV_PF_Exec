name: ckpt-transfer
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download flow_n30
        uses: actions/download-artifact@v4
        with:
          run-id: "41444826741"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl
          name: ckpt_flow_n30_pfrl

      - name: Strip snaps, keep triads
        run: |
          find dl -type d -name snaps -exec rm -rf {} + || true
          find dl -type f | sort

      - name: Push to ckpt_r3 branch
        run: |
          cd dl
          git init -q
          git config user.name "ckpt-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout -q -b ckpt_r3
          git add -A
          git commit -qm "ckpt triads r3: flow_n30"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ckpt_r3
          echo PUSHED
