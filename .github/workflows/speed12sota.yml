name: speed12sota
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: dqnm_n12_flow, scene: flow }
          - { tag: dqnm_n12_burst, scene: burst }
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include

      - name: Probe dqnm n12 (30 rollouts, omp4+torch1)
        shell: bash
        run: |
          set -e
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          S=$(date +%s)
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
          PF_CHANNEL=umi PF_SHADOW_DB=random PF_DXY_MAX=0.5 PF_TORCH_THREADS=1 \
            python dqnm.py --mode dqnm --tau 5 --seed 0 --scene ${{ matrix.scene }} --n-uav 12 \
            --total-rollouts 30 --fresh --task speed12_${{ matrix.tag }} 2>&1 | tail -2
          E=$(date +%s)
          T=$((E-S))
          python -c "t=$T; per=t/30.0; est=per*1200; budget=355*60-420; fit='YES' if est<budget else 'NO'; print(f'[SPEED12 ${{ matrix.tag }}] total_30={t}s per={per:.1f}s est_1200={est:.0f}s ({est/3600:.2f}h) fit={fit}')"
          rm -rf ckpt/speed12_${{ matrix.tag }}
