name: eval-seedfill
on: workflow_dispatch
jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PF_EARLY_THR: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: train native_learned_rizvi3_s1
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          PF_DXY_MAX=0.5 timeout 340m python -W ignore run.py --algo learned \
            --scene static --n 3 --preset rizvi3 --seed 1 \
            --total-rollouts 1200 --fresh --task native_learned_rizvi3_s1
      - name: upload ckpt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-native_learned_rizvi3_s1
          path: code/ckpt/native_learned_rizvi3_s1/**
          retention-days: 7

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          - { task: 'burst_ddpga_tau5_s1_umi_srand', aid: '13402331621', algo: 'ddpga', scene: 'burst', n: '12', seed: '1', real: '0', preset: '', dxy: '0.5' }
          - { task: 'burst_ddpga_tau5_s2_umi_srand', aid: '13403602010', algo: 'ddpga', scene: 'burst', n: '12', seed: '2', real: '0', preset: '', dxy: '0.5' }
          - { task: 'burst_learned_real_tau5_s1_umi_srand', aid: '13398864062', algo: 'learned', scene: 'burst', n: '12', seed: '1', real: '1', preset: '', dxy: '0.5' }
          - { task: 'burst_learned_real_tau5_s2_umi_srand', aid: '13398744603', algo: 'learned', scene: 'burst', n: '12', seed: '2', real: '1', preset: '', dxy: '0.5' }
          - { task: 'burst_learned_tau5_s1_umi_srand', aid: '13397626840', algo: 'learned', scene: 'burst', n: '12', seed: '1', real: '0', preset: '', dxy: '0.5' }
          - { task: 'burst_learned_tau5_s2_umi_srand', aid: '13395835810', algo: 'learned', scene: 'burst', n: '12', seed: '2', real: '0', preset: '', dxy: '0.5' }
          - { task: 'burst_n100_ddpga_tau5_s1_umi_srand', aid: '13412606825', algo: 'ddpga', scene: 'burst', n: '100', seed: '1', real: '0', preset: '', dxy: '0.5' }
