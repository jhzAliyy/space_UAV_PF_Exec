      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: fetch ckpt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/jhzAliyy/space4-run/actions/artifacts/${{ matrix.aid }}/zip" -o a.zip
          unzip -q a.zip -d unpacked
          mkdir -p artifacts/experiments/${{ matrix.task }}/ckpt
          cp unpacked/${{ matrix.task }}/* artifacts/experiments/${{ matrix.task }}/ckpt/
          ls artifacts/experiments/${{ matrix.task }}/ckpt/
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: eval
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          mkdir -p artifacts/lists
          echo "${{ matrix.algo }} 5 ${{ matrix.seed }} ${{ matrix.scene }} 1 0.0 umi ${{ matrix.n }} ${{ matrix.task }} ${{ matrix.preset }}" > artifacts/lists/_one.txt
          cd code
          if [ "${{ matrix.real }}" = "1" ]; then export PF_REAL_OBS=1; fi
          PF_CHANNEL=umi PF_DXY_MAX=${{ matrix.dxy }} python -W ignore evaluate.py ../artifacts/lists/_one.txt ../out_${{ matrix.task }}.csv
      - name: upload csv
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalcsv-${{ matrix.task }}
          path: out_*.csv
          retention-days: 7
