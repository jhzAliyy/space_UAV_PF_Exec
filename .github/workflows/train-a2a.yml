name: train-a2a
on: workflow_dispatch
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          # a2a n30 种子重训：qs7 seed0 训练失败（早停@750 ret 0.20），
          # 判定是否种子个体。flow+burst × seed1/2 四格。
          - { scene: flow,  n: 30, seed: 1 }
          - { scene: flow,  n: 30, seed: 2 }
          - { scene: burst, n: 30, seed: 1 }
          - { scene: burst, n: 30, seed: 2 }
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: train a2a
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          PF_EXECUTOR=fparam PF_CHANNEL=umi PF_DXY_MAX=0.5 PF_REAL_OBS=0 \
            python -W ignore run.py --algo learned --scene ${{ matrix.scene }} --n ${{ matrix.n }} \
            --seed ${{ matrix.seed }} --total-rollouts 1200
      - name: upload ckpt
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-a2a-${{ matrix.scene }}-n${{ matrix.n }}-s${{ matrix.seed }}
          path: code/ckpt/
          retention-days: 3
