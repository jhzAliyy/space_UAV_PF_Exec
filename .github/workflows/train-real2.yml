name: train-real2
on: workflow_dispatch
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          # 2026-11-05 补训批（矩阵裁剪至未训格）：learned 客场 ×4（现行架构
          # 首训——旧架构件已清除）+ learned real n60 ×2。
          - { preset: cheng7, task: native_learned_cheng7, dxy: "2.0" }
          - { preset: rizvi3, task: native_learned_rizvi3, dxy: "0.5" }
          - { preset: shen3,  task: native_learned_shen3,  dxy: "5.0" }
          - { preset: jiang5, task: native_learned_jiang5, dxy: "0.5" }
          - { scene: flow,  n: 60, real: 1, task: flow_n60_learned_real_tau5_s0_umi_srand }
          - { scene: burst, n: 60, real: 1, task: burst_n60_learned_real_tau5_s0_umi_srand }
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: fetch channel tables
        run: |
          cd env_data/channel
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/chan_60_uma_2ghz.npz
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/chan_100_uma_2ghz.npz
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: speed gate (n60 real 项；30 rollouts must fit 6h)
        if: matrix.preset == ''
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          S=$(date +%s)
          PF_CHANNEL=umi PF_DXY_MAX=0.5 PF_REAL_OBS=1 PF_EARLY_THR=0 \
            python -W ignore run.py --algo learned --scene ${{ matrix.scene }} --n ${{ matrix.n }} --total-rollouts 30 2>&1 | tail -1
          E=$(date +%s); PER=$(( (E-S) ))
          echo "30轮 ${PER}s；外推1200轮 $(( PER * 40 / 60 ))min"
          if [ $(( PER * 40 )) -gt 20000 ]; then echo "超6h预算，退出"; exit 1; fi
      - name: train 1200 (满训，PF_EARLY_THR=0)
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          if [ -n "${{ matrix.preset }}" ]; then
            PF_CHANNEL=umi PF_DXY_MAX=${{ matrix.dxy }} PF_EARLY_THR=0 \
              python -W ignore run.py --algo learned --preset ${{ matrix.preset }} --task ${{ matrix.task }} --total-rollouts 1200
          else
            PF_CHANNEL=umi PF_DXY_MAX=0.5 PF_REAL_OBS=1 PF_EARLY_THR=0 \
              python -W ignore run.py --algo learned --scene ${{ matrix.scene }} --n ${{ matrix.n }} \
              --task ${{ matrix.task }} --total-rollouts 1200
          fi
      - name: upload ckpt
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.task }}
          path: code/ckpt/
          retention-days: 3
