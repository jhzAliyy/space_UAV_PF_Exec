name: train-real2
on: workflow_dispatch
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          - { preset: cheng7, task: native_learned_cheng7, dxy: "2.0" }
          - { preset: rizvi3, task: native_learned_rizvi3, dxy: "0.5" }
          - { preset: shen3,  task: native_learned_shen3,  dxy: "5.0" }
          - { preset: jiang5, task: native_learned_jiang5, dxy: "0.5" }
          - { scene: flow,  n: 60, real: 0 }
          - { scene: burst, n: 60, real: 0 }
          - { scene: flow,  n: 60, real: 1 }
          - { scene: burst, n: 60, real: 1 }
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: train 1200
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          if [ -n "${{ matrix.preset }}" ]; then
            PF_CHANNEL=umi PF_DXY_MAX=${{ matrix.dxy }} \
              python -W ignore run.py --algo learned --preset ${{ matrix.preset }} --task ${{ matrix.task }} --total-rollouts 1200
          else
            PF_CHANNEL=umi PF_DXY_MAX=0.5 PF_REAL_OBS=${{ matrix.real }} \
              python -W ignore run.py --algo learned --scene ${{ matrix.scene }} --n ${{ matrix.n }} --total-rollouts 1200
          fi
      - name: upload ckpt
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.preset || format('{0}-n{1}-r{2}', matrix.scene, matrix.n, matrix.real) }}
          path: code/ckpt/
          retention-days: 3
