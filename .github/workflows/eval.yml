name: eval-pool
on:
  workflow_dispatch:

permissions:
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: n12_flow_real, art: ckpt_n12_flow_real, rid: "41470493599", dxy: 0.5, rob: 1, line: "pfrl 5 0 flow 1 0 main 12 flow_pfrl_real_tau5_s0_umi_srand" }
          - { tag: n12_burst_real, art: ckpt_n12_burst_real, rid: "41470493599", dxy: 0.5, rob: 1, line: "pfrl 5 0 burst 1 0 main 12 burst_pfrl_real_tau5_s0_umi_srand" }
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include

      - name: Download ckpt artifact (same repo, source run)
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.art }}
          run-id: ${{ matrix.rid }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl

      - name: Place ckpt into code/ckpt
        shell: bash
        run: |
          find dl -maxdepth 3 | head -20
          mkdir -p code/ckpt
          if [ -d dl/ckpt ]; then cp -r dl/ckpt/* code/ckpt/;
          elif [ -d dl/code/ckpt ]; then cp -r dl/code/ckpt/* code/ckpt/;
          else echo "NO_CKPT_DIR"; exit 1; fi
          ls code/ckpt/

      - name: Evaluate (deterministic, tiers 2000/3000/4000)
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          echo "${{ matrix.line }}" > /tmp/ev.txt
          cat /tmp/ev.txt
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
          PF_CHANNEL=umi PF_SHADOW_DB=random PF_DXY_MAX=${{ matrix.dxy }} PF_REAL_OBS=${{ matrix.rob }} \
            python evaluate.py /tmp/ev.txt "$GITHUB_WORKSPACE/eval_${{ matrix.tag }}.csv"
          echo ===RESULT===
          cat "$GITHUB_WORKSPACE/eval_${{ matrix.tag }}.csv"

      - name: Upload eval csv
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval_${{ matrix.tag }}
          path: eval_${{ matrix.tag }}.csv
