name: eval-real
on: workflow_dispatch
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          - { list: eval_pure.txt,      real: 0 }
          - { list: eval_pure_real.txt, real: 1 }
          - { list: eval_tuned_real.txt, real: 1 }
          # P1 oracle 信息差（2026-11-03 猜想一裁决）：tuned/field 执行器，
          # PF_ORACLE=1 时 Lloyd 质心读真值用户位置。seed 1/2 复现（seed 0 在 CNB 5l9）。
          - { list: oracle_n100_on_s1.txt,  real: 0, oracle: 1, chan: umi }
          - { list: oracle_n100_off_s1.txt, real: 0, oracle: 0, chan: umi }
          - { list: oracle_n200_on_s1.txt,  real: 0, oracle: 1, chan: uma }
          - { list: oracle_n200_off_s1.txt, real: 0, oracle: 0, chan: uma }
          - { list: oracle_n100_on_s2.txt,  real: 0, oracle: 1, chan: umi }
          - { list: oracle_n100_off_s2.txt, real: 0, oracle: 0, chan: umi }
          - { list: oracle_n200_on_s2.txt,  real: 0, oracle: 1, chan: uma }
          - { list: oracle_n200_off_s2.txt, real: 0, oracle: 0, chan: uma }
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
      PF_DXY_MAX: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: channel tables (n100/n200，仓库只带 n12/n30 表)
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/chan_100_uma_2ghz.npz -O env_data/channel/chan_100_uma_2ghz.npz
          mkdir -p env_data/channel/chan_200_uma_2ghz.d
          for f in gain_db.npy x_edges.npy y_edges.npy meta.json; do
            wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/$f -O env_data/channel/chan_200_uma_2ghz.d/$f
          done
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: eval
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          PF_CHANNEL=${{ matrix.chan || 'umi' }} PF_REAL_OBS=${{ matrix.real }} PF_ORACLE=${{ matrix.oracle || '0' }} python -W ignore evaluate.py ../artifacts/lists/${{ matrix.list }} ../out_$(basename ${{ matrix.list }} .txt).csv
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.list }}
          path: out_*.csv
          retention-days: 3
