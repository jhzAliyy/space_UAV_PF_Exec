name: eta1-n30-ablation

on:
  workflow_dispatch:
  push:
    paths: ['code/**', 'deps/**']

jobs:
  ablate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scene: [flow, burst]
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco
          pip install ./deps/MuJoCo-drones-gym

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include
          ls -la *.so

      - name: Run eta1 ablation n30 (${{ matrix.scene }})
        shell: bash
        run: |
          cd code
          PF_CHANNEL=umi OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
            python pfrl.py --mode pfrl --scene ${{ matrix.scene }} \
              --n-uav 30 --total-rollouts 1200 \
              --task ab_eta1_${{ matrix.scene }}_n30 \
              --eta-fixed 1.0 --fresh 2>&1 | tee train_${{ matrix.scene }}.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab_eta1_${{ matrix.scene }}_n30
          path: |
            code/ckpt/ab_eta1_${{ matrix.scene }}_n30/
            code/train_${{ matrix.scene }}.log
          if-no-files-found: warn
