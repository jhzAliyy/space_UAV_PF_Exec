name: train-real
on: workflow_dispatch
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        include:
          # 2026-11-05 补训批 C：Rizvi n12 ×2 走 code_real overlay（repo 主干
          # 为旧一代代码树，缺奖励修复——首训 flow 件与旧作废件逐位一致实证；
          # overlay 后 uav_env/config 为现行修复口径）。
          - { mode: dqnm, scene: flow,  n: 12, real: 0, task: flow_n12_dqnm_tau5_s0_umi_srand }
          - { mode: dqnm, scene: burst, n: 12, real: 0, task: burst_n12_dqnm_tau5_s0_umi_srand }
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PF_TORCH_THREADS: "1"
      PF_SHADOW_DB: random
      PF_DXY_MAX: "0.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: deps
        run: |
          pip install -q numpy gymnasium mujoco torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
      - name: real code overlay (all modes)
        run: |
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/real-code/code_real.tar.gz
          tar xzf code_real.tar.gz
      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
      - name: import check
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code && python -c "import uav_env; print('IMPORT_OK')"
      - name: speed gate (30 rollouts must fit 6h)
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          S=$(date +%s)
          PF_CHANNEL=umi PF_REAL_OBS=${{ matrix.real }} PF_EARLY_THR=0 \
            python -W ignore dqnm.py --mode dqnm --tau 5 --seed 0 --scene ${{ matrix.scene }} --n-uav ${{ matrix.n }} --total-rollouts 30 --fresh --task ${{ matrix.task }} 2>&1 | tail -1
          E=$(date +%s); PER=$(( (E-S) ))
          echo "30轮 ${PER}s；外推1200轮 $(( PER * 40 / 60 ))min"
          if [ $(( PER * 40 )) -gt 20000 ]; then echo "超6h预算，退出"; exit 1; fi
      - name: train 1200 (满训，PF_EARLY_THR=0)
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          cd code
          PF_CHANNEL=umi PF_REAL_OBS=${{ matrix.real }} PF_EARLY_THR=0 \
            python -W ignore dqnm.py --mode dqnm --tau 5 --seed 0 --scene ${{ matrix.scene }} --n-uav ${{ matrix.n }} \
            --task ${{ matrix.task }} --total-rollouts 1200 --fresh
      - name: upload ckpt
        uses: actions/upload-artifact@v4
        with:
          name: ckpt-${{ matrix.task }}
          path: code/ckpt/
          retention-days: 3
