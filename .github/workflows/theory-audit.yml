name: theory-audit

on:
  workflow_dispatch:
    inputs:
      ns:
        description: 'JSON array of n values'
        required: false
        default: '[3,12,30,60,100]'
      scenes:
        description: 'JSON array of scenes'
        required: false
        default: '["flow","burst"]'
      seeds:
        description: 'JSON array of seeds'
        required: false
        default: '[0,1,2]'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        n: ${{ fromJSON(inputs.ns) }}
        scene: ${{ fromJSON(inputs.scenes) }}
        seed: ${{ fromJSON(inputs.seeds) }}
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theory-audit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: deps
        run: pip install -q numpy

      - name: channel tables
        run: |
          mkdir -p env_data/channel
          N=${{ matrix.n }}
          if [ "$N" -le 12 ]; then TAG=12; else TAG=$N; fi
          wget -q https://github.com/jhzAliyy/space4-run/releases/download/chan-tables/chan_${TAG}_uma_2ghz.npz -O env_data/channel/chan_${TAG}_uma_2ghz.npz
          ls -lh env_data/channel/

      - name: build native libs
        run: |
          cd code
          g++ -O3 -fopenmp -shared -fPIC -I shim -I ../deps/lightsfm/include crowd_sfm.cpp -o crowd_sfm.so
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          ls -lh crowd_sfm.so fastlink3.so

      - name: audit
        run: |
          python artifacts/theory_audit/code/theory_audit.py \
            --n ${{ matrix.n }} \
            --scene ${{ matrix.scene }} \
            --seed ${{ matrix.seed }} \
            --snapshots 700,1500

      - name: upload csv
        uses: actions/upload-artifact@v4
        with:
          name: audit-n${{ matrix.n }}-${{ matrix.scene }}-s${{ matrix.seed }}
          path: artifacts/theory_audit/out/theory_audit_n${{ matrix.n }}_${{ matrix.scene }}_s${{ matrix.seed }}.csv
          retention-days: 7
