name: pfg-eval

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [30, 100]
        scene: [flow, burst]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include

      - name: Fetch n100 channel table
        if: matrix.n == 100
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download chan-tables --repo ${{ github.repository }} \
            --pattern "chan_100_uma_2ghz.npz" \
            --output env_data/channel/chan_100_uma_2ghz.npz
          ls -la env_data/channel/

      - name: Run pfg eval (n${{ matrix.n }} ${{ matrix.scene }})
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          echo "pfg 5 0 ${{ matrix.scene }} 1 0 main ${{ matrix.n }}" > /tmp/list.txt
          PF_CHANNEL=umi OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
            python evaluate.py /tmp/list.txt ../artifacts_eval/eval_pfg_n${{ matrix.n }}_${{ matrix.scene }}.csv 2>&1 | tee eval_n${{ matrix.n }}_${{ matrix.scene }}.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pfg_eval_n${{ matrix.n }}_${{ matrix.scene }}
          path: |
            artifacts_eval/
            code/eval_n${{ matrix.n }}_${{ matrix.scene }}.log
            results/
          if-no-files-found: warn
