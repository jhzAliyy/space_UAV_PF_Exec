name: speed-probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {scene: flow,  n: 30, mode: pfrl}
          - {scene: flow,  n: 30, mode: ddpga}
          - {scene: burst, n: 30, mode: ddpga}
          - {scene: flow,  n: 30, mode: dqnm}
          - {scene: burst, n: 30, mode: dqnm}
          - {scene: burst, n: 60, mode: ddpga}
          - {scene: flow,  n: 60, mode: dqnm}
          - {scene: burst, n: 60, mode: dqnm}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip
          pip install numpy gymnasium
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mujoco

      - name: Build C cores
        shell: bash
        run: |
          cd code
          gcc -O3 -funroll-loops -fopenmp -shared -fPIC fastlink3.c -o fastlink3.so -lm
          g++ -O3 -fopenmp -shared -fPIC crowd_sfm.cpp -o crowd_sfm.so -I shim -I ../deps/lightsfm/include

      - name: Fetch n60 channel table
        if: matrix.n == 60
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download chan-tables --repo ${{ github.repository }} \
            --pattern "chan_60_uma_2ghz.npz" \
            --output env_data/channel/chan_60_uma_2ghz.npz
          ls -la env_data/channel/

      - name: Import smoke test
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          python -c "import uav_env, pfrl, ddpga, dqnm; print('IMPORT_OK')"

      - name: Speed probe (30 rollouts, timed)
        shell: bash
        run: |
          cd code
          export PYTHONPATH=$GITHUB_WORKSPACE/deps/MuJoCo-drones-gym:$PYTHONPATH
          S=$(date +%s)
          OMP_NUM_THREADS=4 MKL_NUM_THREADS=4 OPENBLAS_NUM_THREADS=4 \
          PF_CHANNEL=umi PF_SHADOW_DB=random PF_DXY_MAX=0.5 \
            python ${{ matrix.mode }}.py --mode ${{ matrix.mode }} --tau 5 \
            --seed 0 --scene ${{ matrix.scene }} --n-uav ${{ matrix.n }} \
            --total-rollouts 30 --fresh --task speed_${{ matrix.mode }}_${{ matrix.scene }}_n${{ matrix.n }} 2>&1 | tail -5
          E=$(date +%s)
          T=$((E-S))
          python - "$T" <<'EOF'
          import sys
          t = int(sys.argv[1])
          per = t / 30.0
          est = per * 1200
          budget = 355 * 60 - 420
          print(f"[SPEED] total_30={t}s per_rollout={per:.1f}s est_1200={est:.0f}s ({est/3600:.2f}h) budget={budget}s fit={'YES' if est < budget else 'NO'}")
          EOF
